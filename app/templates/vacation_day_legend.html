{# Key to the day calendar's colours. Included by both the self-service and the
   admin vacation page so the two cannot explain the same calendar differently. #}
<div class="vac-legend vacation-day-legend">
    <span><span class="vac-swatch vac-swatch-vacation"></span> {{ t.vacation_legend_vacation }}</span>
    <span><span class="vac-swatch vac-swatch-parental"></span> {{ t.vacation_legend_parental }}</span>
    <span><span class="vac-swatch vac-swatch-off"></span> {{ t.vacation_legend_off }}</span>
    <span>{{ t.vacation_legend_shift }}</span>
</div>
