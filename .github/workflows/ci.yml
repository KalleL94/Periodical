name: CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Match the version run in production (venv) and used to compile requirements.txt
          python-version: "3.14"
          cache: "pip" # Enables automatic caching of dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs the project plus dev dependencies (pytest, ruff, etc.) from pyproject.toml
          pip install ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Audit dependencies for known vulnerabilities
        # Reports without failing the build, because the pinned set already has
        # 25 advisories across 7 packages (cryptography, starlette, idna, pypdf,
        # python-dotenv, python-multipart, urllib3) and a step that blocks every
        # unrelated pull request from day one is a step someone deletes. Drop
        # this line once the backlog is cleared, so a new advisory blocks.
        continue-on-error: true
        run: |
          # Audits the pinned runtime set, not the CI environment: a CVE in a
          # test-only tool does not reach production. Renovate keeps versions
          # current; this is what shouts when a pinned one turns out vulnerable.
          pip install pip-audit
          pip-audit --requirement requirements.txt

      - name: Run Tests
        env:
          # Dummy variables in case the tests load the application configuration
          SECRET_KEY: "test_secret_key_for_ci"
          PRODUCTION: "false"
        run: |
          # Fail the build if coverage drops below the floor (guards against regression, not a target)
          pytest --cov=app --cov-report=term-missing --cov-fail-under=50
