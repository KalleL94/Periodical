[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "periodical"
# Keep in sync with the first entry of data/releases.json,
# which is the authoritative version and what /health reports.
version = "1.6.0"
description = "Rotation scheduling and OB pay calculation"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "jinja2>=3.1.0",
    "sqlalchemy>=2.0.0",
    # Password hashing. Called directly rather than through passlib, which was
    # unmaintained and wrapped a single scheme (app/auth/auth.py).
    "bcrypt>=5,<5.1",
    # Direct dependency: Fernet encryption of API keys at rest (app/auth/auth.py).
    # JWTs are signed with hmac from the standard library, not a JOSE library.
    "cryptography>=42.0",
    "python-multipart>=0.0.6",
    "sentry-sdk[fastapi]>=1.40.0",
    "icalendar>=5.0.0",
    "openpyxl>=3.1.0",
    # Direct dependency: payslip PDF text extraction (app/core/payslip_import.py)
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    # Pin ruff so CI, local and pre-commit lint with the same rules (avoids version drift)
    "ruff==0.16.2",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Ruff 0.16 formats Python inside markdown code blocks. Docs use those blocks to show
# a call argument or a wide dict spread over lines for readability, and reformatting
# collapses them onto one 120-column line or reads a keyword argument as an
# assignment. The prose is not compiled; leave it alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]  # Allow Depends() in function defaults (FastAPI pattern)

[tool.ruff.lint.per-file-ignores]
"app/core/translations.py" = ["E501"]  # Long strings in translation dicts are intentional

[tool.ruff.format]
quote-style = "double"
